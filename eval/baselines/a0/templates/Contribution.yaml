# A Contribution node. Save as store/nodes/contribution/<id>.yaml; fill in and delete what you do not use.
id: contrib_NNNN                    # next free number for this kind (look at the existing files)
kind: Contribution
paper:                          # the id of the paper it comes from (required)
anchor: []                      # the paper's line ranges it rests on, like ["120:135", "210:214"], quoted (required)
description: |                  # what it is, in your own words, readable on its own (required)
  ...
extra:                          # other details as key: value lines (venue, authors, cited_as, caveat ...)
  key: value
ABOUT:                          # what the content is about (the method proposed, a dataset, ...): Content → any node
  <target id>:
RELATES_TO:                     # any other relation; description says which: any node → any node; requires description
  <target id>:
