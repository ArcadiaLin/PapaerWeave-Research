# A Code node. Save as store/nodes/code/<id>.yaml; fill in and delete what you do not use.
id: code_NNNN                    # next free number for this kind (look at the existing files)
kind: Code
name:                           # the main name (required)
alias: []                       # other names it goes by, a list
identities: []                  # external identities <namespace>:<value>, namespaces arxiv, doi, s2, url
source: []                      # the repository at its commit, by source id, like [Autoformer@09994619]
description: |                  # what it is, in your own words, readable on its own
  ...
extra:                          # other details as key: value lines (venue, authors, cited_as, caveat ...)
  key: value
stub:                           # true when only mentioned, not yet described: the name is enough; add identities if known, so others find it
IMPLEMENTS:                     # code or weights implementing a method: Code | Model → Method
  <target id>:
RELATES_TO:                     # any other relation; description says which: any node → any node; requires description
  <target id>:
