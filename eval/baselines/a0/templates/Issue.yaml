# An Issue node. Save as store/nodes/issue/<id>.yaml; fill in and delete what you do not use.
id: issue_NNNN                    # next free number for this kind (look at the existing files)
kind: Issue
name:                           # the main name (required)
alias: []                       # other names it goes by, a list
description: |                  # what it is, in your own words, readable on its own (required)
  ...
extra:                          # other details as key: value lines (venue, authors, cited_as, caveat ...)
  key: value
BROADER:                        # a broader concept of the same kind: Concept → Concept
  <target id>:
RELATES_TO:                     # any other relation; description says which: any node → any node; requires description
  <target id>:
