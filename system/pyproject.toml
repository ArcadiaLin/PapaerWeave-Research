[project]
name = "paperweave"
version = "0.1.0"
description = "PaperWeave：多个互不协调的写者在同一个长期存储中积累论文知识与产物（数据模型、Commit、算子、MCP 服务）"
readme = "README.md"
requires-python = ">=3.12,<3.14"

# 只声明流水线自己 import 的包；notebook 工具在根的 [dependency-groups]。
dependencies = [
    "neo4j>=5.28,<7",   # 图谱读写
    "pyyaml>=6,<7",     # 种子与入库增量
    "httpx>=0.28,<1",   # embedding 服务（vLLM 的 /v1/embeddings），Resolve 的语义阶段
    "graph-vc",         # 写入路径：变更集与版本记录
    "graph-doc",        # 写入路径：graph-doc 解析与求差
    "mcp>=1.20,<2",     # 把算子作为 MCP 工具提供给通用 Agent（paperweave.mcp）
]

# 两个命令即系统对外的入口；评测只经它们（子进程）与 Cypher 读接触系统。
[project.scripts]
paperweave = "paperweave.cli:main"
paperweave-mcp = "paperweave.mcp.server:main"

[tool.uv.sources]
graph-vc = { workspace = true }
graph-doc = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperweave"]

# 新规范（2026-10-05 起）的代码受 ruff 约束；早期代码保持原样，改写时再纳入。
[tool.ruff]
line-length = 120
target-version = "py312"
include = [
    "src/paperweave/__init__.py",
    "src/paperweave/__main__.py",
    "src/paperweave/cli.py",
    "src/paperweave/mcp/**/*.py",
    "src/paperweave/workspace.py",
    "src/paperweave/yamlfmt.py",
    "src/paperweave/operators/**/*.py",
    "src/paperweave/commit/**/*.py",
    "src/paperweave/artifact/**/*.py",
    "src/paperweave/model/__init__.py",
    "src/paperweave/model/schema.py",
    "src/paperweave/model/refs.py",
    "src/paperweave/store/__init__.py",
    "src/paperweave/store/store.py",
    "src/paperweave/store/database.py",
    "src/paperweave/query/__init__.py",
    "src/paperweave/query/conditions.py",
    "src/paperweave/query/materials.py",
    "src/paperweave/query/view.py",
    "tests/**/*.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "RUF"]
# 注释与文档字符串用中文，全角标点是正常写法。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["paperweave", "graph_doc", "graph_vc"]
