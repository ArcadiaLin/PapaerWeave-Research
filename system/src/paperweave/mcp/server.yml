# PaperWeave 的 MCP 暴露：给模型看的全部文字。服务启动时按本文件装配，结构（参数的类型与必填项）来自
# paperweave.tools，这里只写文字。
#
#   server        serverInfo：name 与 version
#   instructions  应该怎样使用这个服务（第一行同时是服务的一句话介绍）
#   tools.<工具>  title；description：这个工具是什么、何时使用；parameters：参数路径 -> 参数说明
#
# 参数路径用 . 连接属性名，[] 表示数组的元素。每个顶层参数都必须有说明；写了不存在的工具或路径时服务不启动。
# 说明中的 {{kinds}} 与 {{relations}} 在装配时换成数据模型登记表生成的词表（paperweave.model.templates.vocabulary），
# search 的说明末尾另由服务在启动时附上库的总览（paperweave.query.overview）。
#
# pi 以 direct 方式列出工具时，模型看不到 instructions，所以用法全部写在各工具的说明里。

server:
  name: PaperWeave
  version: 0.3.0

instructions: |
  PaperWeave is a shared knowledge store built from CS papers by many sessions, with the artifacts they produced.
  Find with search, read whole nodes with get, follow relations with traverse, read paper lines with read_evidence. To write, put a file in your working directory (checkout gives you a blank template or the current nodes) and pass it to commit. Every write is a commit: log, show, diff and as_of read that history.

tools:
  search:
    title: Search
    description: |-
      Find nodes, artifacts and described relations in the store with one query: a name, an identifier (arxiv:2205.13504, or the bare arXiv id) or descriptive words. Exact name, alias, identifier and id matches come first (marked _match), then results ranked by full-text and semantic similarity. A relation hit (such as a CITES or RELATES_TO edge whose description matches) is listed under its start node.

      Results are YAML: each id with a short view (kind, name or description, paper, anchor, key edges); comments after # give the names of ids and the paper sections of anchors. Fields starting with _ are read-only. Use get for all fields and edges of a node, traverse to follow relations exhaustively (search ranks, it does not enumerate), and read_evidence to read the paper lines of an anchor.

      Kinds:
      {{kinds}}
      Artifacts (shared documents sessions edit together): Leaderboard, CompareSettings, Verify, Summarize, Generate, Skill. At most 3 artifacts are mixed into a search unless kind names an artifact type.
    parameters:
      query: A name, identifier, id or descriptive words.
      kind: Only these kinds, families (Entity, Concept, Content), artifact types, or relation types; omit for everything.
      paper: Only Content from these papers (paper ids).
      topn: Number of results, 1-50 (default 10).

  get:
    title: Get
    description: |-
      Read nodes by id: all fields and outgoing edges, in the same YAML shape you write under set (fields) and create (edges) in a graph-doc. Comments after # give the names of ids and the paper sections of anchors; fields starting with _ are read-only (_edges_in counts incoming edges by type: follow them with traverse dir in; _supported_by, _opposed_by and _used_by list who points here). An artifact shows its type, title and abstract, and _stale when something it used changed since; checkout it to read or edit the document.
    parameters:
      ids: Node or artifact ids, at most 20.

  traverse:
    title: Traverse
    description: |-
      Follow relations from known ids, hop by hop, and list every node reached (exhaustive, unlike search). Each hop is {rel, dir, kind}: rel is a relation type or a list of them, dir is out (default, start → end as written below), in or both, kind keeps only end nodes of these kinds. Each reached node comes with a short view and _via: the nodes of the previous step it was reached from and the edge properties. An empty path returns the start nodes' short views.

      Relations (start → end):
      {{relations}}
      - FROM: Content → Paper (system: the paper a record comes from)
      - USED: Artifact → what it used (system); walk USED with dir in from a node to find the artifacts that used it.
      Example, the experiments that evaluate a method and the datasets they use: start [<method id>], path [{rel: EVALUATES, dir: in}, {rel: USES}].
    parameters:
      start: Ids to start from.
      path: "0-3 hops, each {rel, dir?, kind?}."
      path[].rel: A relation type, or a list of them.
      path[].dir: out (default), in or both.
      path[].kind: Keep only end nodes of these kinds, families or artifact types.
      limit: Most nodes to list, 1-100 (default 30); the total is always given.

  read_evidence:
    title: Read evidence
    description: >-
      Read source lines: the lines of a paper (the anchor of a record) or of an artifact document. Write each
      reference as <paper or artifact id>::<start>:<end>, such as paper_0003::120:135; a section in between
      (paper_0003::4.2 Results::120:135) is accepted and ignored. Each item is available (text with line numbers
      and the section it is in), missing or error; at most 400 lines per reference. Read only the lines you need.
    parameters:
      source_refs: List of references <id>::<start>:<end>.
      at: Optional commit id. Resolve the references as of that commit; without it, the current paper version is read.

  checkout:
    title: Checkout
    description: |-
      Put what you want to write into your working directory, as files to edit with your own tools and then pass to commit. Nothing in the store changes.
      - new: [<kind>, ...] gives a blank graph-doc template with one $node per kind, its fields and the relations it can have, with a comment on each; delete what you do not use. An artifact type (Leaderboard, Generate) gives a blank document of that type.
      - ids of nodes give a graph-doc with those nodes under set, as get shows them: change values to edit them.
      - ids of artifacts check out their current documents (artifacts/<title>.md; a Skill goes to .agents/skills/<name>/SKILL.md) with id and base header lines (do not edit those two lines), plus a hint: version, last editors, and what others changed since your last edit.
    parameters:
      ids: Node or artifact ids to edit.
      new: Kinds or artifact types to create, for a blank template, such as [Experiment, Method] or [Leaderboard].

  commit:
    title: Commit
    description: |-
      Write to the store: pass files from your working directory. A graph-doc (a YAML file starting with graph-doc: v0.2) creates, changes or deletes nodes and relations; an artifact document (Markdown with a type header) creates or updates a shared artifact. All files are checked first; if anything blocks, nothing is written. status ready (with dry_run) or committed; blocked lists errors with at (file:line and the place in the doc), msg and often fix: edit those lines and commit again.

      A graph-doc has up to four sections:
        graph-doc: v0.2
        create:                              # new nodes, and new edges from any node
          $paper:                            # $name: a new node; the reply maps it to an id
            kind: Paper
            name: Are Transformers Effective for Time Series Forecasting?
            identities: [arxiv:2205.13504]   # without the version
            year: 2023
            material: papers/2205.13504v3/paper.md   # the Markdown you read; anchors are its line numbers
          $dlinear:
            kind: Method
            name: DLinear
            description: |
              A one-layer linear model on decomposed trend and remainder ...
          $exp:
            kind: Experiment
            paper: $paper
            anchor: [120:135, 141:150]       # lines of the paper's material
            figures: [S4.T2]
            description: |
              Long-horizon forecasting on six benchmarks against Transformer baselines ...
            EVALUATES:                       # UPPERCASE keys are relations: {target: properties}; methods, not Models
              $dlinear: {role: target, result: own}
              method_0004: {role: baseline, result: cited}
            USES:
              dataset_0002: {role: evaluation_data, printed_as: ETTh1}
          method_0004:                       # an existing id under create: new edges only
            RELATES_TO:
              $dlinear: {description: "..."}
        set:                                 # change fields of existing nodes; null clears a field
          method_0004: {alias: [Informer]}
        delete:
          claim_0007: null                   # the whole node and its edges
          exp_0002: {USES: [dataset_0005]}   # only these edges
        confirm:
          $dlinear: {distinct_from: [method_0011]}
          exp_0002: {revise: {reason: "...", anchor: [88:90]}}

      Rules:
      - Refer to existing nodes by id only (find them with search). A $name is valid only inside its file.
      - Writing a node that already exists blocks with exists; an edge that already exists with the same properties is skipped. To change, use set (fields) or delete (edges); to replace an edge's properties, write it under set.
      - New Entities and Concepts are checked for duplicates: a dedup error lists stored candidates. If one is the same thing, use its id instead of your $name; if none is, add confirm: {$name: {distinct_from: [the candidate ids]}}.
      - Content (Experiment, Claim, Contribution) records what a paper says. New edges on an existing record need anchor (on the edge, or in confirm revise); changing its fields or edges needs confirm: {id: {revise: {reason, anchor}}}; deleting it needs reason. The old version stays in the history.
      - Fields starting with _ and # comments are ignored, so a node pasted from get can go under set unchanged.
      - Quote short text containing ": " or starting with a special character; put long text in a | block.

      {{kinds}}
      Relations (start → end; * marks required properties):
      {{relations}}
      Any edge may also carry anchor (paper lines), description and extra; an edge whose start is not a paper or Content gives paper when it has an anchor.
    parameters:
      files: Paths of files in your working directory; at most one graph-doc.
      message: One line saying what this commit does; for artifact documents, also what you changed and why.
      reason: Why you changed or deleted artifact lines written by others; required when the check lists such lines.
      dry_run: true only checks and shows what would change.

  log:
    title: Log
    description: |-
      List the writes to the store, newest first. Every change is a commit. Each entry gives the commit id, time, writer (by), source, message, counts of created, updated and deleted nodes and edges, and the ids it touched (first 20). Log does not give contents; use show for those. The branch is pinned on the first call; later pages stay at that commit.

      A page holds at most budget commits and at most 16 KB; meta.continuation is then set.
    parameters:
      branch: Branch to list (default main, the shared store).
      node: Only commits that created, changed or deleted these nodes or their relations; a list of ids.
      by: Only commits by this writer.
      source: Only commits whose source starts with this text.
      since: Only commits after this commit id (not including it), or at or after this ISO time such as 2026-10-06T14:00.
      until: Only commits up to and including this commit id, or up to this ISO time; a date alone includes that whole day.
      budget: Number of commits in this page (default 50).
      continuation: meta.continuation of the previous page; keep the other parameters unchanged.

  show:
    title: Show
    description: |-
      Show one commit: what it changed and what it was based on. part summary (default): header (id, parent, at, by, source, message), counts, touched and removed ids, confirmations and revisions, new-id mapping. part input: the text that was submitted, verbatim. part changes: one entry per node {id, kind, op, fields: {field: [before, after]}, edges}. Results are at most 16 KB; a value too long is shortened and listed in _cut: read it with node, field and offset.
    parameters:
      commit: The commit id (from log); main means the latest commit.
      part: summary, input or changes (default summary).
      node: With part changes, only these nodes; exactly one id when field is given.
      field: With part changes, a path listed in _cut, to read that value in full.
      offset: With field, where to continue reading; 0 or the previous meta.next_offset.
      continuation: meta.continuation of the previous page; keep the other parameters unchanged.

  diff:
    title: Diff
    description: |-
      The net difference between two commits on the same branch, from `from` to `to`: a summary, then one entry per changed node {id, kind, op, fields, edges}. A field changed and changed back does not appear; use log and show for each step. At most 16 KB per page.
    parameters:
      from: The earlier commit id.
      to: The later commit id; main (default) means the latest commit.
      node: Only these nodes; exactly one id when field is given.
      field: A path listed in _cut, to read that value in full.
      offset: With field, where to continue reading; 0 or the previous meta.next_offset.
      continuation: meta.continuation of the previous page; keep the other parameters unchanged.

  as_of:
    title: As of
    description: |-
      Read nodes as they were right after a past commit, by id. This is history: do not paste it into a graph-doc, which would undo later changes. Nodes that did not exist then are listed in meta.missing. At most 16 KB per page; a value too long is shortened and listed in _cut.
    parameters:
      at: The commit id; main means the latest commit.
      ids: The nodes to read.
      field: A path listed in _cut, to read that value in full (with exactly one id).
      offset: With field, where to continue reading; 0 or the previous meta.next_offset.
      continuation: meta.continuation of the previous page; keep the other parameters unchanged.
