[project]
name = "cacheplan-t1"
version = "0.1.0"
description = "T1：多写者积累时间线（先导）的运行框架"
readme = "README.md"
requires-python = ">=3.12,<3.14"

# 只声明流水线自己 import 的包；评测框架建在 e09 的写入路径与读视图之上。
dependencies = [
    "cacheplan-e09",
    "graph-vc",
    "pyyaml>=6,<7",
]

[tool.uv.sources]
cacheplan-e09 = { workspace = true }
graph-vc = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/t1"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["t1", "e09", "graph_doc", "graph_vc"]
