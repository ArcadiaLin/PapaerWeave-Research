[project]
name = "cacheplan-t1"
version = "0.1.0"
description = "T1：多写者积累时间线（先导）的运行框架"
readme = "README.md"
requires-python = ">=3.12,<3.14"

# 评测与被测系统分离（evaluation_draft §10.1）：t1 不 import 系统代码，只经它的命令行与 MCP 入口（子进程）、
# Cypher 读与文件交互（tests/test_imports.py）。paperweave 列在这里，是因为运行框架在同一环境中启动这些子进程。
# neo4j 是 Cypher 读（快照、分支头）用的驱动。
dependencies = [
    "paperweave",
    "neo4j>=5.28,<7",
    "pyyaml>=6,<7",
]

[tool.uv.sources]
paperweave = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/t1"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["t1", "paperweave", "graph_doc", "graph_vc"]
