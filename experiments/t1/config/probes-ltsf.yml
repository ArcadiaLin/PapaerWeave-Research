    text: >-
      Build a table of ETTh1 horizon-96 MSE for PatchTST, DLinear, FEDformer and Autoformer as reported in each
      paper that reports them, with each paper's input-length setting. Which numbers can be compared directly?
    gold:
      values:
        - {paper: 2211.14730v2, method: PatchTST/64, dataset: ETTh1, horizon: 96, metric: MSE, value: 0.370, anchor: "2211.14730v2:188"}
        - {paper: 2211.14730v2, method: DLinear, dataset: ETTh1, horizon: 96, metric: MSE, value: 0.375, anchor: "2211.14730v2:188"}
        - {paper: 2211.14730v2, method: FEDformer, dataset: ETTh1, horizon: 96, metric: MSE, value: 0.376, anchor: "2211.14730v2:188"}
        - {paper: 2211.14730v2, method: Autoformer, dataset: ETTh1, horizon: 96, metric: MSE, value: 0.435, anchor: "2211.14730v2:188"}
        - {paper: 2304.08424v5, method: PatchTST/64, dataset: ETTh1, horizon: 96, metric: MSE, value: 0.379, anchor: "2304.08424v5:231"}
        - {paper: 2304.08424v5, method: DLinear, dataset: ETTh1, horizon: 96, metric: MSE, value: 0.375, anchor: "2304.08424v5:231"}
        - {paper: 2310.09751v3, method: "PatchTST^∗", dataset: ETTh1, horizon: 96, metric: MSE, value: 0.404, anchor: "2310.09751v3:232"}
        - {paper: 2310.09751v3, method: DLinear, dataset: ETTh1, horizon: 96, metric: MSE, value: 0.386, anchor: "2310.09751v3:232"}
        - {paper: 2310.09751v3, method: Autoformer, dataset: ETTh1, horizon: 96, metric: MSE, value: 0.449, anchor: "2310.09751v3:232"}
        - {paper: 2403.01673v1, method: PatchTST, dataset: ETTh1, horizon: 96, metric: MSE, value: 0.370, anchor: "2403.01673v1:637"}
        - {paper: 2403.09898v2, method: PatchTST, dataset: ETTh1, horizon: 96, metric: MSE, value: 0.414, anchor: "2403.09898v2:218"}
      rubric:
