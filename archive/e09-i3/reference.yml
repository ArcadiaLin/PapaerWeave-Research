  inferences: ['The DLinear column in patchtst Table 3 is DLinear-S (L=336): not stated, matched by values.']
  key_points: ['The fair pair is PatchTST/42 (L=336) vs DLinear (L=336), patchtst::130; PatchTST/64 uses L=512.',
    PatchTST/42 is lower on all four horizons for both metrics., 'DLinear values are cited from the DLinear paper
