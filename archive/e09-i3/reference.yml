  - a: pt42_mse
    b: ptdl_mse
    lower: {'96': a, '192': a, '336': a, '720': a}
    conditions: {dataset: same, metric: same, split: same, T: same, L: same, channels: same, training: same}
  - a: pt42_mae
    b: ptdl_mae
    lower: {'96': a, '192': a, '336': a, '720': a}
    conditions: {dataset: same, metric: same, split: same, T: same, L: same, channels: same, training: same}
  relations:
  - a: ptdl_mse
    b: dl4s_mse
    expectation: same_source
    observation: consistent
    mismatched: []
    interpretation: double_counted
    basis: ['patchtst::128 cites DLinear results from the DLinear paper']
  - a: ptdl_mae
    b: dl4s_mae
    expectation: same_source
    observation: consistent
    mismatched: []
    interpretation: double_counted
    basis: ['patchtst::128']
