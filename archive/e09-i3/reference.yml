# I3 首个实例的参考答案（i3-v1），与 questions.yml 一一对应。由 Claude 读表写出，2026-10-03 经用户确认。
#
# - series 的数值按原文印的字符串保存（保留末位 0 与 "0474" 这类误印），评分时转为数值比较；
#   tests/test_i3_reference.py 逐值核对它们确实出现在对应表的锚点行范围内。
# - comparisons：同条件的性能比较，lower 为每个 T 上较低的一方（a / b / tie）。
# - relations：两组报告值的关系：expectation 由来源与条件定，observation 由数值定；
#   b 为列表时表示出处论文中的全部候选序列，observation=no_match_in_source 即无一相符。
#   interpretation 取 double_counted / transcription_deviation / no_contradiction / possibly_reused / suspected_copy_error。
#   口径见 docs/designs/v2/intents_decompose.md I3"报告值之间的关系口径"。
# - evidence：独立证据数；key_points 与 must_not 供人工评分（解释是否越界）。
# - 这些是"可比性与证据计数"的参考，不裁决哪个数字正确。

version: i3-v1
