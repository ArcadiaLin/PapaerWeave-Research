      patchtst Tables 1, 4, 5, 7, 9, 10, 11, 12, 13, 15: one run reused, not more evidence; Table 14 gives the 5-seed
      mean (0.3669 at T=96).']
  must_not: [Count DLinear's results in patchtst and dlinear as two pieces of evidence., Compare PatchTST/64 with
      DLinear as the like-for-like pair without noting L differs.]
