# T1 先导：多写者积累时间线的 A3 图库。与 neo4j-e09（7687）、neo4j-test（7688）端口分开，可同时运行。
services:
  neo4j-t1:
    image: neo4j:ubi10
    container_name: neo4j-t1

    ports:
      - "7476:7474"
      - "7689:7687"

    environment:
      NEO4J_AUTH: neo4j/password
      # WSL 只有 8 GB：不设时 heap 默认取可见内存的 1/4，且容器无上限
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m

    mem_limit: 2g

    volumes:
      - ./data:/data
      - ./logs:/logs

    restart: unless-stopped
